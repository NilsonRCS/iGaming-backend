services:
  postgres:
    image: postgres:16-alpine
    container_name: igaming_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: igaming
      POSTGRES_USER: igaming
      POSTGRES_PASSWORD: igaming
    ports:
      - "5433:5432"   # host:5433 → container:5432 (evita conflito com postgres local)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U igaming -d igaming"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3
    container_name: igaming_localstack
    restart: unless-stopped
    environment:
      SERVICES: sqs
      DEBUG: 0
      DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init.sh:ro
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 15

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: igaming_app
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432   # porta interna da rede do compose (5433 é só no host)
      AWS_ENDPOINT: http://localstack:4566
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  # ── Instância extra para testar concorrência ──────
  app2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: igaming_app2
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432   # porta interna da rede do compose (5433 é só no host)
      AWS_ENDPOINT: http://localstack:4566
      APP_PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

volumes:
  postgres_data:
  localstack_data:
